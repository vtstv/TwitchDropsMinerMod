services:
  twitch-drops-miner:
    build: .
    image: vtstv/twitch-drops-miner:latest
    container_name: twitch-drops-miner
    restart: unless-stopped
    ports:
      - "28088:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=UTC
      # Web UI Authentication (leave empty or commented out to disable)
      # - WEB_USERNAME=admin
      # - WEB_PASSWORD=your_secret_password
